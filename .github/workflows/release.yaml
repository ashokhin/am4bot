name: Create release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+'

permissions:
    contents: write
    packages: write

jobs:

  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        # full history + tags: needed to diff against the previous tag below
        fetch-depth: 0

    - name: Create release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="${{ github.ref_name }}"
        DATE=$(date -u '+%Y-%m-%d')

        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "release $TAG already exists, skipping"
          exit 0
        fi

        # --generate-notes only lists merged pull requests, so a tag whose
        # commits went straight to master (no PR) ends up with an almost
        # empty body -- just the "Full Changelog" compare link. List every
        # commit by subject instead, so nothing in the tag range is dropped.
        PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)

        {
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:'- %s (%h)' "${PREV_TAG}..${TAG}"
            echo
            echo
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
          else
            git log --pretty=format:'- %s (%h)' "${TAG}"
          fi
        } > release-notes.md

        gh release create "$TAG" --title "$TAG / ${DATE}" --notes-file release-notes.md

  upload-assets:
    needs: create-release
    strategy:
      matrix:
          os: [linux, windows]
          arch: [amd64]

    name:  "${{ matrix.os }}-${{ matrix.arch }}: Build and upload release assets"
    runs-on: ubuntu-latest

    steps:

    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set env variables
      run: |
        echo BUILD_USER=$(id -u --name) >> ${GITHUB_ENV}
        echo BUILD_HOST=$(hostname) >> ${GITHUB_ENV}
        echo BUILD_DATE=$(date -u '+%Y-%m-%dT%H:%M:%S,%N%:z') >> ${GITHUB_ENV}

    - name: Build application
      uses: wangyoucao577/go-release-action@v1
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        goos: ${{ matrix.os }}
        goarch: ${{ matrix.arch }}
        md5sum: false
        overwrite: true
        multi_binaries: true
        project_path: ./cmd/ambot ./cmd/scanner
        extra_files: LICENSE README.md
        pre_command: export CGO_ENABLED=0
        build_flags: -v
        ldflags: >
          "-X github.com/prometheus/common/version.Version=${{ github.ref_name }}
          -X github.com/prometheus/common/version.Branch=${{ github.ref }}
          -X github.com/prometheus/common/version.Revision=${{ github.sha }}
          -X github.com/prometheus/common/version.BuildUser=${{env.BUILD_USER}}@${{env.BUILD_HOST}}
          -X github.com/prometheus/common/version.BuildDate=${{env.BUILD_DATE}}"
