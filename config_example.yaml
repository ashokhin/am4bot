### Common options for both Bot and Scanner
#
# Airline Manager URL
url: "https://www.airlinemanager.com/"
# Username for login
username: "your_email@example.com"
# Password for login
password: "YourPasswordHere"
# Logging level (debug, info, warn, error)
log_level: "warn"
# Run browser in headless mode
# ! Not recommended to change this option
# ! on systems without GUI support
chrome_headless: true
# Enable detailed Chrome/Chromium debugging logs
chrome_debug: true

### Bot-specific configuration
#
# Percentage of budget to use for each category
budget_percent:
  # Percentage of budget for Fuel
  fuel: 75
  # Percentage of budget for Maintenance
  maintenance: 25
  # Percentage of budget for Marketing
  marketing: 75
# Good price thresholds for resources
good_price:
  # Good price for Fuel (per 1,000 Lbs)
  fuel: 550
  # Good price for CO2 (per 1,000 Quotas)
  co2: 140
# Maximum number of hubs for maintenance ("repair lounge", "buy catering") per run
hubs_maintenance_limit: 3
# Whether to repair lounges in hubs
repair_lounges: true
# Whether to buy catering if missing in hubs
buy_catering_if_missing: true
# Catering duration in hours to set when buying catering
catering_duration_hours: "24"
# Catering amount option to select when buying catering
catering_amount_option: "5000"
# Aircraft wear percentage to trigger maintenance
aircraft_wear_percent: "70"
# Max hours to next A-Check to trigger it
aircraft_max_hours_to_check: 48
# Max aircraft for modifications check
aircraft_modify_limit: 5
# Fuel level percentage to trigger refuel. Even the price isn't good
fuel_critical_percent: 15
# Cron-like schedule for services
cron_schedule: "*/10 * * * *"
# List of services to run
services:
    - "company_stats"
    - "alliance_stats"
    - "claim_rewards"
    - "staff_morale"
    - "hubs"
    - "buy_fuel"
    - "marketing"
    - "ac_maintenance"
    - "depart"
alliance_ids:
    - "1" # Grizzly Group
    - "21" # CODESHARE
    - "44" # Alpha Vikings
# Timeout for full round in seconds
timeout_seconds: 180
# Address to expose Prometheus metrics
prometheus_address: ":9150"

### Scanner-specific configuration
#
# Scan type: "route_scanner" (default, scans hubs_list), "airport_scanner"
# (lists countries/airports without saving), "full_catalog_scanner" (scans
# every airport in the game and writes routes to catalog_db_path — a
# multi-day, one-time job), or "catalog_codes_scanner" (lightweight pass that
# backfills the IATA or ICAO code for every airport already in catalog_db_path;
# set the account's code-display setting in-game to match catalog_code_type
# before running it)
scan_type: "route_scanner"
# List of hubs to scan routes
hubs_list:
    - "New York JFK, United States"
    - "Beijing Capital, China"
    - "Istanbul Atatürk, Turkey"
    - "New Delhi, India"
    - "Brasília, Brazil"
    - "Atlanta Int, United States"
    - "Reykjavík - Keflavik, Iceland"
# Maximum distance for route.
# NOTE: also used by "full_catalog_scanner" — for a full scrape this should be
# set permissively (e.g. 20000) rather than tuned to a specific aircraft, so no
# real route is excluded from the catalog.
max_route_range_km: 14500
# Minimum distance for route. For "full_catalog_scanner", set to 0.
min_route_range_km: 6500
# Minimal runway length for route. For "full_catalog_scanner", set to 0 so no
# destination is excluded — the calculator applies aircraft-specific runway
# constraints later, at query time.
min_runway_length: 9680
# Scan step between "max_route_range_km" and "min_route_range_km"
scan_step_km: 100
# Output SQLite path for "full_catalog_scanner" / "catalog_codes_scanner"
catalog_db_path: "am4_catalog.db"
# Which code column "catalog_codes_scanner" fills in: "iata" or "icao"
catalog_code_type: "iata"
